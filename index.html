<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Second Chance - Ruins of Destiny</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: #000;
            font-family: 'Georgia', serif;
            color: #e0e0e0;
            overflow: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent; /* Remove flash de toque em mobile */
        }

        /* --- LAYOUT GERAL --- */
        #game-container {
            width: 100vw;
            height: 100vh;
            /* Suporte para altura real em mobile (barra de endereço) */
            height: 100dvh; 
            position: relative;
        }

        #bg-layer {
            position: absolute;
            inset: 0;
            z-index: 1;
            background: #000;
        }

        #bg {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: opacity 0.6s ease-in-out;
        }

        #sprite-layer {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            z-index: 3;
            height: 85vh;
            pointer-events: none;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }

        #charImg {
            height: 100%;
            max-width: 90vw;
            object-fit: contain;
            opacity: 0;
            visibility: hidden; 
            transition: opacity 0.5s ease-in-out, visibility 0.5s;
            filter: drop-shadow(0 0 20px rgba(0,0,0,0.5));
        }

        #charImg.visible {
            opacity: 1;
            visibility: visible;
        }

        #overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.3);
            z-index: 2;
            pointer-events: none;
        }

        #ui-layer {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding-bottom: 20px;
        }

        /* --- MENU PRINCIPAL --- */
        #main-menu {
            position: fixed;
            inset: 0;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        #main-menu::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: url('assets/chars/login.png');
            background-size: cover;
            background-position: center;
            opacity: 0.4;
        }

        #main-menu::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at center, transparent 0%, rgba(0,0,0,0.7) 70%, rgba(0,0,0,0.9) 100%);
        }

        #main-menu.hidden { display: none; }

        .menu-content {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: clamp(30px, 5vw, 60px);
            width: min(500px, 90vw);
            background: rgba(0,0,0,0.85);
            border: 3px solid #d4a574;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(212,165,116,0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .menu-content::before, .menu-content::after {
            content: ''; position: absolute; width: 30px; height: 30px; border: 2px solid #d4a574;
        }
        .menu-content::before { top: 15px; left: 15px; border-right: none; border-bottom: none; }
        .menu-content::after { top: 15px; right: 15px; border-left: none; border-bottom: none; }

        .game-title {
            font-size: clamp(1.8em, 6vw, 2.5em);
            margin-bottom: 10px;
            color: #d4a574;
            text-shadow: 0 0 20px rgba(212,165,116,0.5);
            font-weight: bold;
            letter-spacing: 2px;
            line-height: 1.1;
        }

        .subtitle {
            font-size: clamp(0.9em, 3vw, 1.2em);
            margin-bottom: 30px;
            color: #b8935f;
            font-style: italic;
        }

        #playerName {
            padding: 15px;
            border-radius: 6px;
            border: 2px solid #d4a574;
            width: 100%;
            margin-bottom: 20px;
            background: rgba(0,0,0,0.6);
            color: #d4a574;
            text-align: center;
            font-size: 1.1em;
        }
        #playerName:focus { outline: none; border-color: #f5d899; background: rgba(0,0,0,0.8); }

        #startBtn {
            padding: 15px 40px;
            width: 100%;
            background: linear-gradient(135deg, #8b6914, #d4a574, #8b6914);
            border: 2px solid #d4a574;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            font-size: 1.1em;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-family: 'Georgia', serif;
            box-shadow: 0 4px 15px rgba(212,165,116,0.4);
            transition: all 0.3s;
        }
        #startBtn:active { transform: translateY(2px); }

        /* --- CAIXA DE DIÁLOGO --- */
        #textbox {
            width: min(95%, 900px);
            margin: 0 auto 10px auto;
            background: rgba(0,0,0,0.85);
            border: 2px solid #d4a574;
            border-radius: 8px;
            padding: 20px 25px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
            min-height: 130px;
            max-height: 30vh;
            position: relative;
            overflow-y: auto;
            /* Scroll suave */
            scrollbar-width: thin;
            scrollbar-color: #d4a574 rgba(0,0,0,0.5);
        }
        #textbox.hidden { display: none; }

        .speaker-container { position: absolute; top: -14px; left: 20px; z-index: 20; }
        
        #speaker {
            background: linear-gradient(135deg, #8b6914, #d4a574);
            padding: 4px 20px;
            border-radius: 4px;
            border: 2px solid #d4a574;
            font-weight: bold;
            color: #000;
            font-size: 0.95em;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }

        #text {
            line-height: 1.6;
            font-size: 1.1em;
            margin-top: 10px;
            white-space: pre-wrap;
        }

        .next-indicator {
            position: absolute; bottom: 10px; right: 15px;
            animation: bounce 1s infinite; color: #d4a574;
            font-size: 1.2em;
        }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

        /* --- ESCOLHAS --- */
        .choice-container {
            display: flex; flex-direction: column; align-items: center;
            gap: 12px; margin-bottom: 20px; padding: 0 10px;
            max-height: 40vh; overflow-y: auto;
            width: 100%;
        }

        .choice {
            width: min(100%, 600px);
            background: rgba(0,0,0,0.85);
            color: #d4a574;
            padding: 15px 20px;
            border: 2px solid #8b6914;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1.05em;
            transition: all 0.2s;
            text-align: left;
            position: relative;
            line-height: 1.4;
        }
        .choice:active { background: #d4a574; color: #000; transform: scale(0.98); }
        
        /* Desktop Hover */
        @media (hover: hover) {
            .choice:hover {
                background: linear-gradient(135deg, rgba(139,105,20,0.3), rgba(212,165,116,0.2));
                border-color: #d4a574; transform: translateY(-2px); color: #f5d899;
            }
        }

        /* --- UI CONTROLS --- */
        #settings-btn {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 1001;
            background: rgba(0,0,0,0.7);
            border: 2px solid #d4a574;
            color: #d4a574;
            font-size: 1.5em;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(2px);
        }
        #settings-btn.hidden { display: none; }

        #settings-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: min(400px, 90vw);
            background: rgba(15, 15, 15, 0.98);
            border: 2px solid #d4a574;
            border-radius: 10px;
            padding: 25px;
            z-index: 2500;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 0 0 50px rgba(0,0,0,0.9);
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        #settings-modal.active { opacity: 1; pointer-events: all; }

        #settings-modal h2 {
            color: #d4a574;
            margin-bottom: 5px;
            font-family: 'Georgia', serif;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 1px solid #8b6914;
            padding-bottom: 10px;
            font-size: 1.5em;
        }

        .volume-control { display: flex; flex-direction: column; gap: 8px; text-align: left; }
        .volume-control label { color: #b8935f; font-size: 0.95em; }
        
        .volume-control input[type="range"] {
            width: 100%;
            height: 6px;
            background: #333;
            border-radius: 5px;
            accent-color: #d4a574;
            cursor: pointer;
        }

        .settings-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 5px;
        }

        .settings-btn-action {
            background: rgba(255,255,255,0.05);
            border: 1px solid #d4a574;
            color: #d4a574;
            padding: 12px;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'Georgia', serif;
            font-size: 1em;
            transition: background 0.2s;
        }
        .settings-btn-action:active { background: #d4a574; color: #000; }
        
        /* Botão de Reset estilo perigo */
        .btn-reset {
            grid-column: span 2;
            border-color: #d45d5d;
            color: #d45d5d;
            margin-top: 5px;
        }
        .btn-reset:active { background: #d45d5d; color: #fff; }

        .close-settings {
            background: transparent; border: none; color: #888;
            cursor: pointer; margin-top: 10px; text-decoration: underline;
            padding: 10px; font-size: 1em;
        }

        #route-indicator {
            position: absolute;
            top: 15px; left: 15px;
            background: rgba(0,0,0,0.85);
            padding: 8px 15px;
            border-radius: 20px;
            border: 1px solid #8b6914;
            font-size: 0.8em;
            color: #d4a574;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 100;
            pointer-events: none;
        }
        #route-indicator.visible { opacity: 1; }

        #toast {
            position: fixed; top: 70px; left: 50%; transform: translateX(-50%);
            background: rgba(15,15,15,0.95); color: #d4a574;
            padding: 12px 25px; border-radius: 30px;
            border: 1px solid rgba(212,165,116,0.5);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            z-index: 3000; opacity: 0; transition: opacity 0.3s; pointer-events: none;
            font-size: 0.9em; text-align: center;
            width: max-content; max-width: 80vw;
        }
        #toast.show { opacity: 1; top: 80px; }

        /* --- MEDIA QUERIES PARA MOBILE --- */
        @media (max-width: 768px) {
            /* Ajuste de Sprite */
            #sprite-layer {
                height: 65vh; /* Personagem menor para não ficar atrás do texto */
                bottom: 10px;
            }
            
            /* Ajuste do Texto */
            #textbox {
                margin-bottom: 5px;
                padding: 15px 20px;
                min-height: 140px; /* Garante altura para toque */
                font-size: 0.95em; /* Fonte levemente menor para caber mais */
            }
            
            #text {
                font-size: 1.05em;
                line-height: 1.5;
            }

            /* Botões de Escolha maiores para toque */
            .choice {
                padding: 15px;
                font-size: 1em;
            }

            /* Título do Menu */
            .game-title {
                font-size: 2em;
                margin-bottom: 5px;
            }
            
            /* Ajustes do Modal */
            #settings-modal {
                width: 95vw;
                padding: 20px;
            }
            
            .settings-actions {
                grid-template-columns: 1fr; /* Botões empilhados */
            }
            .btn-reset {
                grid-column: span 1;
            }

            /* Indicador de Rota menor */
            #route-indicator {
                top: 10px; left: 10px;
                padding: 5px 12px;
                font-size: 0.75em;
            }

            /* Botão de engrenagem */
            #settings-btn {
                top: 10px; right: 10px;
            }
        }
        
        /* Ajuste para telas muito pequenas (iPhone SE etc) */
        @media (max-height: 600px) {
            #sprite-layer { height: 55vh; }
            #textbox { min-height: 110px; max-height: 35vh; }
            .menu-content { padding: 20px; }
            .game-title { font-size: 1.8em; }
        }
    </style>
</head>
<body>
    <audio id="bgm" loop></audio>
    <audio id="sfx"></audio>
    <div id="toast"></div>

    <button id="settings-btn" class="hidden" onclick="toggleSettings()">⚙️</button>

    <div id="settings-modal">
        <h2>Configurações</h2>
        
        <div class="volume-control">
            <label for="vol-music">🎵 Música</label>
            <input type="range" id="vol-music" min="0" max="1" step="0.1" value="0.5" oninput="updateVolume('bgm', this.value)">
        </div>

        <div class="volume-control">
            <label for="vol-sfx">🔊 Efeitos</label>
            <input type="range" id="vol-sfx" min="0" max="1" step="0.1" value="1" oninput="updateVolume('sfx', this.value)">
        </div>

        <div class="settings-actions">
            <button class="settings-btn-action" onclick="saveGame()">💾 Salvar</button>
            <button class="settings-btn-action" onclick="loadGame()">📂 Carregar</button>
            <button class="settings-btn-action btn-reset" onclick="resetGame()">🔄 Resetar Jogo</button>
        </div>

        <button class="close-settings" onclick="toggleSettings()">Voltar ao Jogo</button>
    </div>

    <div id="game-container">
        <div id="bg-layer">
            <img id="bg" alt="Cenário">
        </div>
        <div id="sprite-layer">
            <img id="charImg" alt="">
        </div>
        <div id="overlay"></div>

        <div id="ui-layer">
            <div id="route-indicator">
                <span id="route"></span>
            </div>

            <div id="main-menu">
                <div class="menu-content">
                    <h1 class="game-title">Second Chance</h1>
                    <p class="subtitle">Ruins of Destiny</p>
                    <input id="playerName" type="text" placeholder="Digite seu nome..." maxlength="15" autocomplete="off">
                    <button id="startBtn">Começar</button>
                    
                    <div style="margin-top: 25px; color: rgba(212,165,116,0.4); font-size: 0.8em; font-style: italic;">
                        Manu&Sam Studios
                    </div>
                    
                    <span style="position: absolute; bottom: 15px; left: 15px; width: 20px; height: 20px; border: 2px solid #d4a574; border-right: none; border-top: none;"></span>
                    <span style="position: absolute; bottom: 15px; right: 15px; width: 20px; height: 20px; border: 2px solid #d4a574; border-left: none; border-top: none;"></span>
                </div>
            </div>

            <div id="textbox" class="hidden">
                <div class="speaker-container">
                    <span id="speaker"></span>
                </div>
                <div class="text-container">
                    <p id="text"></p>
                </div>
                <div class="next-indicator">▼</div>
            </div>

            <div id="choices" class="choice-container"></div>
        </div>
    </div>

    <script>
    // --- ESTADO DO JOGO ---
    let playerName = "";
    let state = "menu";
    let isTyping = false;
    let currentRoute = "";
    let affection = { lucien: 0, eryon: 0, kaiden: 0, aelion: 0 };
    let isSettingsOpen = false;

    // --- ELEMENTOS DO DOM ---
    const bgm = document.getElementById("bgm");
    const sfx = document.getElementById("sfx");
    const bgImg = document.getElementById("bg");
    const charImg = document.getElementById("charImg");
    const speakerBox = document.getElementById("speaker");
    const textBox = document.getElementById("text");
    const textbox = document.getElementById("textbox");
    const choicesBox = document.getElementById("choices");
    const mainMenu = document.getElementById("main-menu");
    const routeIndicator = document.getElementById("route-indicator");
    const routeDisplay = document.getElementById("route");
    const startBtn = document.getElementById("startBtn");
    const nameInput = document.getElementById("playerName");
    const settingsBtn = document.getElementById("settings-btn");
    const settingsModal = document.getElementById("settings-modal");

    // Inicializa volumes padrão
    bgm.volume = 0.5;
    sfx.volume = 1.0;

    // --- SISTEMA DE DIÁLOGO E EFEITOS ---
    function typeText(element, text) {
        element.innerText = "";
        isTyping = true;
        let i = 0;
        const processedText = text.replace(/Eu/g, playerName || "Eu");

        function type() {
            if (i < processedText.length) {
                element.innerText += processedText.charAt(i);
                i++;
                // Velocidade de digitação levemente mais rápida para mobile
                setTimeout(type, 25);
            } else {
                isTyping = false;
            }
        }
        type();
    }

    function playMusic(filename) {
        if (!filename) return;
        const newSrc = "assets/audio/" + filename + ".mp3";
        // Decodificação de URL para evitar recarregar a mesma música se tiver caracteres especiais
        if (decodeURIComponent(bgm.getAttribute("src")).includes(filename)) return;
        
        bgm.src = newSrc;
        bgm.play().catch(e => console.log("Áudio bloqueado até interação"));
    }

    function updateVolume(type, value) {
        if (type === 'bgm') {
            bgm.volume = value;
        } else if (type === 'sfx') {
            sfx.volume = value;
        }
    }

    function toggleSettings() {
        isSettingsOpen = !isSettingsOpen;
        if (isSettingsOpen) {
            settingsModal.classList.add("active");
        } else {
            settingsModal.classList.remove("active");
        }
    }

    function setBackground(filename) {
        if (!filename) return;
        
        bgImg.style.opacity = "0";
        setTimeout(() => {
            bgImg.src = "assets/chars/" + filename + ".png";
            bgImg.onerror = () => { bgImg.src = ""; }; // Fallback
            bgImg.onload = () => { bgImg.style.opacity = "1"; };
        }, 300);
    }

    function setCharacter(filename) {
        charImg.classList.remove("visible");

        if (!filename) {
            setTimeout(() => { charImg.src = ""; }, 500);
            return;
        }
        
        setTimeout(() => {
            charImg.src = "assets/chars/" + filename + ".png";
            charImg.onerror = () => {
                console.warn("Sprite ausente: " + filename);
                charImg.classList.remove("visible"); 
            };
            charImg.onload = () => { 
                charImg.classList.add("visible"); 
            };
        }, 250);
    }

    function updateRoute(routeName) {
        if (routeName) {
            currentRoute = routeName;
            routeDisplay.innerText = routeName; // Texto mais curto para mobile
            routeIndicator.classList.add("visible");
        }
    }

    function showToast(message) {
        const toast = document.getElementById("toast");
        toast.textContent = message;
        toast.classList.add("show");
        setTimeout(() => toast.classList.remove("show"), 3000);
    }

    // --- CONTROLE DE FLUXO ---
    function showChoices(choices) {
        choicesBox.innerHTML = "";
        choices.forEach(choice => {
            const btn = document.createElement("button");
            btn.className = "choice";
            btn.innerText = choice.text;
            // Ontouchstart ajuda na responsividade do toque em mobile
            btn.onclick = (e) => {
                e.stopPropagation();
                if (choice.affect) affection[choice.affect] += (choice.value || 0);
                choicesBox.innerHTML = "";
                loadScene(choice.next);
            };
            choicesBox.appendChild(btn);
        });
    }

    function loadScene(sceneId) {
        const scene = routes[sceneId];
        
        if (!scene) {
            console.error("Cena não encontrada: " + sceneId);
            return;
        }

        state = sceneId; 

        if (scene.route) updateRoute(scene.route);
        if (scene.music) playMusic(scene.music);
        if (scene.char !== undefined) setBackground(scene.char); 
        
        // Lógica de Sprite: se definido 'sprite', usa. Se não, limpa.
        if (scene.sprite) {
            setCharacter(scene.sprite);
        } else {
            setCharacter(null);
        }

        if (scene.text) {
            speakerBox.innerText = scene.speaker || "";
            // Se não tiver speaker, esconde a caixinha
            if (!scene.speaker) {
                speakerBox.style.display = "none";
            } else {
                speakerBox.style.display = "block";
            }
            
            textbox.classList.remove("hidden");
            typeText(textBox, scene.text);
        }

        choicesBox.innerHTML = "";
        
        if (scene.choices) {
            setTimeout(() => showChoices(scene.choices), 500);
        } else if (scene.end) {
            setTimeout(() => {
                textBox.innerHTML = `<p style='text-align: center; font-size: 1.1em; color: #d4a574; font-weight: bold;'>${scene.endText}</p>`;
                showToast("Fim da história!");
            }, 1000);
        }
    }

    // --- SAVE/LOAD/RESET ---
    function saveGame() {
        const saveData = {
            scene: state,
            affection: affection,
            route: currentRoute,
            playerName: playerName,
            bgmVol: bgm.volume,
            sfxVol: sfx.volume,
            date: new Date().toLocaleString()
        };
        localStorage.setItem("RUINS_SAVE", JSON.stringify(saveData));
        showToast("Jogo salvo com sucesso!");
        toggleSettings();
    }

    function loadGame() {
        const data = localStorage.getItem("RUINS_SAVE");
        if (!data) return showToast("Nenhum save encontrado.");
        
        try {
            const save = JSON.parse(data);
            affection = save.affection;
            currentRoute = save.route;
            playerName = save.playerName;
            state = save.scene;
            
            if (save.bgmVol !== undefined) {
                bgm.volume = save.bgmVol;
                document.getElementById("vol-music").value = save.bgmVol;
            }
            if (save.sfxVol !== undefined) {
                sfx.volume = save.sfxVol;
                document.getElementById("vol-sfx").value = save.sfxVol;
            }

            if (currentRoute) updateRoute(currentRoute);
            nameInput.value = playerName;
            
            mainMenu.classList.add("hidden");
            settingsBtn.classList.remove("hidden");
            
            if (isSettingsOpen) toggleSettings();
            
            loadScene(save.scene);
            showToast("Jogo carregado!");
        } catch (e) {
            console.error("Erro save", e);
            showToast("Erro ao carregar save.");
        }
    }

    // --- NOVA FUNÇÃO: RESETAR JOGO ---
    function resetGame() {
        if(confirm("Tem certeza? Isso apagará seu save atual e reiniciará o jogo.")) {
            localStorage.removeItem("RUINS_SAVE");
            location.reload(); // Recarrega a página para limpar a memória RAM e estados
        }
    }

    // --- EVENT LISTENERS ---
    startBtn.onclick = () => {
        if (!nameInput.value.trim()) {
            showToast("Digite seu nome!");
            return;
        }
        playerName = nameInput.value.trim();
        mainMenu.classList.add("hidden");
        settingsBtn.classList.remove("hidden");
        
        // Tenta tocar música se já estiver carregada
        if (bgm.src) bgm.play().catch(e=>{});
        loadScene("cena1_1");
    };

    document.addEventListener("click", (e) => {
        if (isSettingsOpen) return;

        // Ignora cliques em elementos de UI
        if (e.target.closest(".choice") || 
            e.target.closest("#settings-btn") || 
            e.target.closest("#settings-modal") || 
            e.target.closest("#main-menu") ||
            e.target.closest(".menu-content")) return;

        const scene = routes[state];
        
        // Avançar texto
        if (scene && scene.next && !scene.choices && !scene.end) {
            if (isTyping) {
                // Se quiser pular a digitação, descomente a linha abaixo e ajuste a lógica de typeText
                // isTyping = false; 
                return; 
            }
            loadScene(scene.next);
        }
    });

    // --- DADOS DAS ROTAS ---
    const routes = {
        // (Mantive os mesmos dados originais, a lógica é idêntica)
        cena1_1: { speaker: "Eu", text: "Hoje foi uma sexta-feira complicada. Muita demanda para entregar aquele projeto de sistema.", char: "escritório1", music: "escritório", next: "cena1_2" },
        cena1_2: { speaker: "Eu", text: "Olho o relógio. Nossa, já são 18h00. Finalmente a hora de voltar para casa. Pego minha bolsa e desligo o computador.", char: "escritório2", next: "cena2_1" },
        cena2_1: { speaker: "Eu", text: "Nossa, que gelo que está hoje. Que dor de cabeça... foi muito cansativo. Parece que minha cabeça vai explodir. Vou passar na farmácia do outro lado da avenida pegar um remédio.", char: "rua1", music: "chuva", next: "cena2_2" },
        cena2_2: { speaker: "Eu", text: "Caiu um pingo de água no meu olho. Aii, que merda... começou a chover. Vou correr logo para a farmácia.", char: "rua2", next: "cena3_1" },
        cena3_1: { speaker: "Eu", text: "Vou aproveitar e correr antes que o sinal feche. A chuva já engrossou, estou encharcado. Atravessando a avenida...", char: "acidente1", music: "o acidente", next: "cena3_2" },
        cena3_2: { speaker: "", text: "BAAAANG. Barulho de batida e chuva.", char: "acidente2", next: "cena3_3" },
        cena3_3: { speaker: "", text: "O mundo gira. O sangue. A dor.", char: "acidente3", next: "cena3_4" },
        cena3_4: { speaker: "", text: "Tudo fica escuro.", char: "acidente4", next: "cena4_1" },
        
        cena4_1: { speaker: "Eu", text: "Huum... o que está acontecendo? Não estou enxergando. Está tudo escuro. Alguém consegue me ouvir?", char: "vazio1", music: "menu", next: "cena4_2" },
        cena4_2: { speaker: "", text: "Uma luz surge ao longe, crescendo gradualmente.", char: "vazio2", next: "cena4_3" },
        cena4_3: { speaker: "", text: "Ela toma a forma de uma mulher.", char: "vazio3", sprite: "aleia_normal", next: "cena4_4" },
        cena4_4: { speaker: "Aleia", text: "Eu sou Aleia, responsável por cuidar das reencarnações de quem não conseguiu cumprir seu propósito.", char: "vazio3", sprite: "aleia_normal", next: "cena4_5" },
        
        cena4_5: { speaker: "Eu", text: "Eu morri...?", char: "vazio3", sprite: "aleia_normal", next: "cena4_6" },
        cena4_6: { speaker: "Aleia", text: "Sim. Um motorista perdeu o controle na chuva.", char: "vazio3", sprite: "aleia_normal", next: "cena4_7" },
        cena4_7: { speaker: "Eu", text: "E meus gatos...?", char: "vazio3", sprite: "aleia_normal", next: "cena4_8" },
        cena4_8: { speaker: "Aleia", text: "Estão bem. Tudo foi resolvido.", char: "vazio3", sprite: "aleia_normal", next: "cena4_9" },
        cena4_9: { speaker: "Aleia", text: "Do outro lado do portão está sua próxima reencarnação. Lá você terá a chance de cumprir sua missão.", char: "vazio3", sprite: "aleia_normal", next: "cena4_10" },
        cena4_10: { speaker: "Eu", text: "O quê?! Espera, eu nem entendi ainda!", char: "vazio4", next: "cena5_1" },
        
        cena5_1: { speaker: "Eu", text: "Ah... que claro... está tudo embaçado.", char: "ruinas1", music: "passos na floresta", next: "cena5_2" },
        cena5_2: { speaker: "Eu", text: "Começo a enxergar ao redor. Que mulher estranha... não explicou nada. Será que tem reclamação aqui no céu? Rs. Bom, eu morro mas não perco a piada.", char: "ruinas2", next: "cena5_3" },
        cena5_3: { speaker: "Eu", text: "Acordei em meio a uma floresta. Um antigo palácio em ruínas, estátuas de deuses destruídas. Passo por um portão quebrado.", char: "ruinas5", next: "cena6_1" },
        cena6_1: { speaker: "Eu", text: "Começo a andar em meio às árvores mas parece estar escurecendo. Meus pés doem. Continuo andando por mais umas 2hrs e escuto o barulho de o que parece ser um rio. Chego até um rio. Bom, sempre dizem que onde tem agua deve ter vida. Será que eu devo descer o rio, qual caminho devo seguir?", char: "caminho2", next: "cena6_2" },
        
        cena6_2: { speaker: "", text: "Qual será sua escolha?", char: "caminho2", choices: [
            { text: "Seguir o rio, até a cidade", next: "lucien_1", affect: "lucien", value: 1 },
            { text: "Ficar aqui e descansar nos pés da árvore", next: "eryon_1", affect: "eryon", value: 1 },
            { text: "Entrar e seguir o caminho pela floresta", next: "kaiden_1", affect: "kaiden", value: 1 },
            { text: "Voltar para as ruínas de onde vim", next: "aelion_1", affect: "aelion", value: 1 }
        ]},

        // ROTA LUCIEN
        lucien_1: { route: "Lucien", speaker: "Eu", text: "Caminho lentamente pela margem do rio. A água reflete a luz fraca da lua, ondulando como prata líquida. Meus pés doem, minhas roupas ainda estão úmidas da chuva.", char: "lucien1", music: "gótica do lucien", next: "lucien_2" },
        lucien_2: { speaker: "Eu", text: "O som da correnteza me acompanha por um tempo até que, entre as árvores, percebo algo diferente. Pedras alinhadas. Um caminho antigo, parcialmente tomado pelo musgo.", char: "lucien2", next: "lucien_3" },
        lucien_3: { speaker: "Eu", text: "Sigo por ele com cautela. Após alguns minutos, as árvores se abrem. Diante de mim, surge um castelo enorme, envolto por névoa e silêncio.", char: "lucien3", next: "lucien_4" },
        lucien_4: { speaker: "Eu", text: "Um castelo?! Ótimo... considerando meu histórico recente, provavelmente vou acabar queimada numa fogueira. O portão principal está entreaberto.", char: "lucien3", choices: [
            { text: "Não tenho opção, preciso de abrigo.", next: "lucien_5" },
            { text: "Isso é claramente uma péssima ideia... mas vou entrar.", next: "lucien_5" },
            { text: "Se eu morrer de novo, vou reclamar com Aleia.", next: "lucien_5" }
        ]},
        lucien_5: { speaker: "Eu", text: "O interior é escuro, mas não abandonado. Há móveis cobertos por poeira, tapeçarias antigas rasgadas pelo tempo. Um arrepio percorre minha espinha. Tem alguém aqui?", char: "lucien5", next: "lucien_6" },
        lucien_6: { speaker: "Eu", text: "Nenhuma resposta. Exausta, encontro um sofá antigo perto de uma lareira apagada. Me deito, o corpo pesado demais para continuar alerta. Meus olhos se fecham.", char: "lucien6", next: "lucien_7" },
        lucien_7: { speaker: "Eu", text: "Sinto. Antes mesmo de ouvir. Uma presença pesada, dominante. Abro os olhos lentamente. Uma sombra está no canto do salão.", char: "presença2", next: "lucien_8" },
        lucien_8: { speaker: "Lucien", text: "Quem é você... e o que faz em minha casa?", char: "lucien7", sprite: "lucien_sombra", next: "lucien_9" },
        lucien_9: { speaker: "Eu", text: "Ele se aproxima. Quando a luz o alcança, vejo olhos vermelhos, cabelo escuro, pele pálida. O ar ao redor dele carrega um cheiro suave de rosas vermelhas.", char: "lucien8", sprite: "lucien_normal", next: "lucien_10" },
        lucien_10: { speaker: "Eu", text: "M-me desculpe... Eu não quis invadir, achei que estivesse abandonado.", char: "presença3", sprite: "lucien_normal", next: "lucien_11" },
        lucien_11: { speaker: "Lucien", text: "Ele me observa como um predador analisa a presa. Que azar o seu. Vai morrer esta noite.", char: "lucien9", sprite: "lucien_bravo", choices: [
            { text: "Espere! Eu posso ir embora agora!", next: "lucien_12" },
            { text: "Se vai me matar, ao menos diga seu nome.", next: "lucien_12" },
            { text: "Você não parece tão assustador assim.", next: "lucien_12" }
        ]},
        lucien_12: { speaker: "Eu", text: "Ele se move rápido demais. Sinto mãos frias segurando meus braços. Antes que eu possa gritar, uma dor aguda explode em meu pescoço.", char: "presença5", next: "lucien_13" },
        lucien_13: { speaker: "Eu", text: "A-ah...! O mundo gira. O sangue. A dor. E então — UMA LUZ BRANCA IRROMPE DE MIM.", char: "presença7", next: "lucien_14" },
        lucien_14: { speaker: "Eu", text: "O salão se ilumina violentamente. O estranho é arremessado contra uma coluna de pedra. Silêncio absoluto.", char: "presença8", next: "lucien_15" },
        lucien_15: { speaker: "Eu", text: "Respiro com dificuldade. Minhas mãos ainda brilham fracamente.", char: "presença9", next: "lucien_16" },
        lucien_16: { speaker: "Lucien", text: "Ele se levanta lentamente. Você... não é humana.", char: "lucien10", sprite: "lucien_surpreso", next: "lucien_17" },
        lucien_17: { speaker: "Lucien", text: "Meu nome é Lucien. Aquela luz... é Origem.", char: "lucien11", sprite: "lucien_normal", next: "lucien_18" },
        lucien_18: { speaker: "Eu", text: "Aleia...", char: "presença11", next: "lucien_19" },
        lucien_19: { speaker: "Lucien", text: "Ao ouvir o nome, Lucien endurece. Então foi ela que te enviou.", char: "lucien11", sprite: "lucien_bravo", choices: [
            { text: "Você conhece Aleia?", next: "lucien_20" },
            { text: "Ela não me explicou nada!", next: "lucien_20" },
            { text: "Se isso é culpa dela, eu também quero respostas.", next: "lucien_20" }
        ]},
        lucien_20: { speaker: "Lucien", text: "Você não deveria estar aqui. Mas agora que está... não posso te deixar na floresta. Fique. Ao menos esta noite.", char: "presença12", sprite: "lucien_normal", next: "lucien_21" },
        lucien_21: { speaker: "Eu", text: "Adormeço novamente. O mundo desaparece. Estou no vazio. Aleia surge diante de mim.", char: "sonho1", next: "lucien_22" },
        lucien_22: { speaker: "Aleia", text: "O Ciclo das Reencarnações foi quebrado. Você é o Fragmento da Origem.", char: "sonho2", sprite: "aleia_normal", next: "lucien_23" },
        lucien_23: { speaker: "Aleia", text: "Não é viver. É decidir quem merece continuar existindo.", char: "sonho3", sprite: "aleia_normal", choices: [
            { text: "Eu não pedi por isso.", next: "lucien_24" },
            { text: "E se eu me recusar?", next: "lucien_24" },
            { text: "E Lucien... faz parte disso?", next: "lucien_24" }
        ]},
        lucien_24: { speaker: "Aleia", text: "Aleia apenas sorri. Suas escolhas já começaram.", char: "sonho3", sprite: "aleia_normal", next: "lucien_25" },
        lucien_25: { speaker: "Eu", text: "Acordo sobressaltada. Lucien está sentado ao lado da cama. Você sabia.", char: "lucien20", sprite: "lucien_normal", next: "lucien_26" },
        lucien_26: { speaker: "Lucien", text: "Sim. Reencarnadas despertam monstros.", char: "lucien20", sprite: "lucien_normal", next: "lucien_27" },
        lucien_27: { speaker: "Eu", text: "Você está com fome?", char: "lucien20", sprite: "lucien_normal", next: "lucien_28" },
        lucien_28: { speaker: "Lucien", text: "Lucien fecha os olhos por um instante. Sempre. Ele levanta a mão lentamente. Posso?", char: "lucien22", sprite: "lucien_normal", choices: [
            { text: "Sim.", next: "lucien_29" },
            { text: "Só se prometer não me machucar.", next: "lucien_29" },
            { text: "Não... ainda não.", next: "lucien_30" }
        ]},
        lucien_29: { speaker: "Eu", text: "Se permitido, ele toca minha mão. Uma marca antiga surge, pulsando entre nós. O castelo treme.", char: "lucien23", next: "lucien_31" },
        lucien_30: { speaker: "Lucien", text: "Ele respeita sua escolha e aguarda. Estarei aqui quando estiver pronta.", char: "lucien20", sprite: "lucien_normal", next: "lucien_31" },
        lucien_31: { speaker: "Lucien", text: "Caçadores de Origem. Sombras se movem atrás das paredes.", char: "lucien26", sprite: "lucien_alerta", next: "lucien_32" },
        lucien_32: { speaker: "Lucien", text: "Se fizer isso... não há volta.", char: "lucien25", sprite: "lucien_alerta", choices: [
            { text: "Beijá-lo", next: "lucien_final" },
            { text: "Fugir", next: "lucien_ending_2" },
            { text: "Recuar", next: "lucien_ending_3" }
        ]},
        lucien_final: { speaker: "Eu", text: "Eu já morri uma vez. Não vou viver fugindo. Eu o beijo. Sangue e luz se unem. Um símbolo eterno se forma no ar. As sombras gritam e são julgadas. Aleia surge. Você escolheu amar. Eu escolhi não decidir sozinha. Lucien segura minha mão. Então o Ciclo será transformado. Os Caçadores desaparecem. O sol nasce sobre o castelo. Lucien caminha à luz do dia. Minha eternidade... agora tem um começo. O castelo floresce.", char: "lucien_final4", end: true, endText: "🩸 FIM DA ROTA LUCIEN - Obrigado por jogar!" },
        lucien_ending_2: { speaker: "Eu", text: "Eu corro. Pela porta, pela floresta, fugindo do castelo e do destino que me espera.", char: "lucien25", end: true, endText: "🩸 FIM DA ROTA LUCIEN - Liberdade Conquistada" },
        lucien_ending_3: { speaker: "Lucien", text: "Você recua. Lucien abaixa a mão, pacientemente. Esperarei pelo tempo que precisar.", char: "lucien20", end: true, endText: "🩸 FIM DA ROTA LUCIEN - Incerteza Permanece" },

        // ROTA ERYON
        eryon_1: { route: "Eryon", speaker: "Eu", text: "Vou descansar no pé da árvore. Amanhã eu caminho um pouco mais... Afinal, hoje não vai dar mais nada. Deito aos pés da grande árvore ancestral, abraçando meus próprios braços.", char: "eryon1", music: "trilha do aelion", next: "eryon_2" },
        eryon_2: { speaker: "Eu", text: "O frio da noite começa a incomodar. Fecho os olhos. O cansaço vence.", char: "eryon1", next: "eryon_3" },
        eryon_3: { speaker: "Estranho", text: "No meio do sono, algo muda. O frio desaparece. Meu corpo começa a esquentar, como se estivesse envolvido por uma manta invisível. Coitadinha... Mais um pouco e teria congelado.", char: "eryon2", next: "eryon_4" },
        eryon_4: { speaker: "Eu", text: "Abro os olhos lentamente. Ele está ali, ajoelhado ao meu lado. Seu corpo emana uma aura dourada, quente e suave. Ele é lindo. Como o próprio sol em forma humana, iluminando a noite. Estou sonhando?", char: "eryon2", sprite: "eryon_brilho", next: "eryon_5" },
        eryon_5: { speaker: "Estranho", text: "Ele sorri com gentileza. Se for um sonho... por que seu coração está tão acelerado?", char: "eryon2", sprite: "eryon_sorrindo", choices: [
            { text: "Me aproximar instintivamente do calor", next: "eryon_6" },
            { text: "Recuar assustada", next: "eryon_7" },
            { text: "Se for sonho, não me acorde.", next: "eryon_6" }
        ]},
        eryon_6: { speaker: "Estranho", text: "Ele sorri. Meu nome é Eryon.", char: "eryon3", sprite: "eryon_normal", next: "eryon_8" },
        eryon_7: { speaker: "Estranho", text: "Ele compreende seu medo. Não tema. Estou aqui para proteger. Meu nome é Eryon.", char: "eryon3", sprite: "eryon_normal", next: "eryon_8" },
        eryon_8: { speaker: "Eu", text: "Digo meu nome.", char: "eryon3", sprite: "eryon_normal", next: "eryon_9" },
        eryon_9: { speaker: "Eryon", text: "Eu sei. A luz reconhece aquilo que carrega a Origem.", char: "eryon3", sprite: "eryon_normal", next: "eryon_10" },
        eryon_10: { speaker: "Eu", text: "Meu coração dispara. Você é... o quê exatamente?", char: "eryon2", sprite: "eryon_normal", next: "eryon_11" },
        eryon_11: { speaker: "Eryon", text: "Ele se senta ao meu lado, encostando as costas na árvore. Alguns me chamam de guardião. Outros... de Deus da Luz.", char: "eryon3", sprite: "eryon_normal", choices: [
            { text: "Você veio me julgar?", next: "eryon_12" },
            { text: "Então por que está aqui comigo?", next: "eryon_12" },
            { text: "Isso explica o brilho exagerado.", next: "eryon_12" }
        ]},
        eryon_12: { speaker: "Eu", text: "Ah... Claro. Faz todo sentido.", char: "eryon3", sprite: "eryon_normal", next: "eryon_13" },
        eryon_13: { speaker: "Eu", text: "O vento sopra forte. Eryon ergue a mão. Uma barreira dourada envolve a árvore.", char: "eryon4", next: "eryon_14" },
        eryon_14: { speaker: "Eu", text: "Isso é lindo...", char: "eryon4", next: "eryon_15" },
        eryon_15: { speaker: "Eryon", text: "É apenas calor... e intenção. Ele me observa em silêncio por alguns segundos. Você não pertence a este mundo. Mas carrega algo que até os deuses temem.", char: "eryon4", sprite: "eryon_serio", next: "eryon_16" },
        eryon_16: { speaker: "Eu", text: "Eu só queria descansar.", char: "eryon4", sprite: "eryon_serio", next: "eryon_17" },
        eryon_17: { speaker: "Eryon", text: "Às vezes, é assim que o destino começa.", char: "eryon4", sprite: "eryon_serio", choices: [
            { text: "Você sempre ajuda humanos assim?", next: "eryon_18" },
            { text: "Posso ficar aqui mais um pouco?", next: "eryon_18" },
            { text: "Você parece... sozinho.", next: "eryon_19" }
        ]},
        eryon_18: { speaker: "Eryon", text: "Ele me observa. Talvez apenas você.", char: "eryon5", sprite: "eryon_normal", next: "eryon_20" },
        eryon_19: { speaker: "Eryon", text: "Talvez. Até agora. Mas sua presença muda isso.", char: "eryon5", sprite: "eryon_normal", next: "eryon_20" },
        eryon_20: { speaker: "Eryon", text: "Eryon hesita, depois estende a mão. Se eu tocar você... posso quebrar leis antigas.", char: "eryon5", sprite: "eryon_normal", next: "eryon_21" },
        eryon_21: { speaker: "Eu", text: "E se eu deixar?", char: "eryon5", sprite: "eryon_normal", next: "eryon_22" },
        eryon_22: { speaker: "Eryon", text: "Ele engole em seco.", char: "eryon5", sprite: "eryon_normal", choices: [
            { text: "Permitir e segurar a mão dele", next: "eryon_23" },
            { text: "Permitir, mas pedir cuidado", next: "eryon_23" },
            { text: "Recusar por medo", next: "eryon_ending_early" }
        ]},
        eryon_23: { speaker: "Eu", text: "Quando o toque acontece, um símbolo de luz aparece brevemente entre nossas mãos. O ar treme.", char: "eryon5", next: "eryon_24" },
        eryon_24: { speaker: "Eryon", text: "...isso é perigoso.", char: "eryon6", sprite: "eryon_preocupado", next: "eryon_25" },
        eryon_25: { speaker: "Eryon", text: "Eryon se afasta um pouco. Preciso te contar algo. Antes de você... eu já havia caído.", char: "eryon6", sprite: "eryon_serio", next: "eryon_26" },
        eryon_26: { speaker: "Eryon", text: "Os Deuses decidiram que aquela civilização devia desaparecer. Eu vi esperança onde eles viram erro.", char: "eryon6", sprite: "eryon_serio", next: "eryon_27" },
        eryon_27: { speaker: "Eu", text: "O que você fez?", char: "eryon6", sprite: "eryon_serio", next: "eryon_28" },
        eryon_28: { speaker: "Eryon", text: "Salvei vidas. Escolhi humanos.", char: "eryon6", sprite: "eryon_serio", next: "eryon_29" },
        eryon_29: { speaker: "Eu", text: "E isso foi proibido?", char: "eryon6", sprite: "eryon_serio", next: "eryon_30" },
        eryon_30: { speaker: "Eryon", text: "Amar humanos é visto como falha.", char: "eryon7", sprite: "eryon_triste", choices: [
            { text: "Então valeu a pena.", next: "eryon_31" },
            { text: "Você se arrepende?", next: "eryon_31" },
            { text: "Eu também te escolheria.", next: "eryon_31" }
        ]},
        eryon_31: { speaker: "Eu", text: "O céu escurece. Símbolos dourados rasgam o ar.", char: "eryon7", next: "eryon_32" },
        eryon_32: { speaker: "", text: "Vozes: O Deus Caído deve ser apagado. A humana será julgada.", char: "eryon8", next: "eryon_33" },
        eryon_33: { speaker: "Eryon", text: "Eryon se coloca à minha frente. Não toquem nela.", char: "eryon8", sprite: "eryon_batalha", next: "eryon_34" },
        eryon_34: { speaker: "Eu", text: "Não. Dou um passo à frente. Desta vez... eu escolho. A Origem desperta em mim.", char: "eryon8", next: "eryon_35" },
        eryon_35: { speaker: "Aleia", text: "Aleia surge. Então você chegou à sua decisão.", char: "eryon9", sprite: "aleia_normal", choices: [
            { text: "Amor não é falha.", next: "eryon_36" },
            { text: "Deuses não devem decidir sozinhos.", next: "eryon_36" },
            { text: "Eu escolho Eryon.", next: "eryon_36" }
        ]},
        eryon_36: { speaker: "Eu", text: "A luz explode. Os símbolos divinos se quebram.", char: "eryon9", next: "eryon_37" },
        eryon_37: { speaker: "Aleia", text: "Fragmento da Origem... faça seu julgamento.", char: "eryon9", sprite: "aleia_sorrindo", next: "eryon_38" },
        eryon_38: { speaker: "Eu", text: "Deuses que negam escolha... não merecem governar sozinhos. A luz envolve Eryon. As marcas de punição desaparecem.", char: "eryon10", next: "eryon_39" },
        eryon_39: { speaker: "Eryon", text: "...o que você fez?", char: "eryon10", sprite: "eryon_surpreso", next: "eryon_40" },
        eryon_40: { speaker: "Eu", text: "Te devolvi a escolha. O amanhecer surge. Não divino. Humano.", char: "eryon10", sprite: "eryon_sorrindo", next: "eryon_41" },
        eryon_41: { speaker: "Eryon", text: "Eryon está ao meu lado. Sua luz agora é suave, constante. Eu posso ficar. Onde você estiver. Ele segura minha mão.", char: "eryon11", sprite: "eryon_feliz", next: "eryon_42" },
        eryon_42: { speaker: "Eryon", text: "Não sou mais um deus completo. E você não é apenas humana.", char: "eryon11", sprite: "eryon_feliz", next: "eryon_43" },

        eryon_ending_early: { speaker: "Eryon", text: "Ele respeita seu medo e recua. Estarei aqui quando estiver pronta.", char: "eryon4", end: true, endText: "☀️ FIM DA ROTA ERYON - Medo Permanece" },

        kaiden_2: { speaker: "Eu", text: "O ar fica estranho. Silencioso demais. Dou mais alguns passos. Então— Risadas. Baixas. Próximas.", char: "kaiden1", next: "kaiden_3" },

        kaiden_4: { speaker: "Estranho", text: "Você entrou bem fundo no meu território, humana.", char: "kaiden2", sprite: "kaiden_arvore", next: "kaiden_5" },
