<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Second Chance - Ruins of Destiny</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: #000;
            font-family: 'Georgia', serif;
            color: #e0e0e0;
            overflow: hidden;
            user-select: none;
        }

        #game-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        #bg-layer {
            position: absolute;
            inset: 0;
            z-index: 1;
            background: #000;
        }

        #bg {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: opacity 0.6s ease-in-out;
        }

        #sprite-layer {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            z-index: 3;
            height: 85vh;
            pointer-events: none;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }

        #charImg {
            height: 100%;
            max-width: 90vw;
            object-fit: contain;
            transition: opacity 0.5s ease-in-out;
            filter: drop-shadow(0 0 20px rgba(0,0,0,0.5));
        }

        #overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.3);
            z-index: 2;
            pointer-events: none;
        }

        #ui-layer {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        /* MENU */
        #main-menu {
            position: fixed;
            inset: 0;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        #main-menu::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: url('assets/chars/login.png');
            background-size: cover;
            background-position: center;
            opacity: 0.4;
        }

        #main-menu::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at center, transparent 0%, rgba(0,0,0,0.7) 70%, rgba(0,0,0,0.9) 100%);
        }

        #main-menu.hidden { display: none; }

        .menu-content {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: clamp(40px, 8vw, 60px) clamp(30px, 6vw, 50px);
            max-width: min(500px, 90vw);
            background: rgba(0,0,0,0.85);
            border: 3px solid #d4a574;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(212,165,116,0.3);
        }

        .menu-content::before,
        .menu-content::after {
            content: '';
            position: absolute;
            width: clamp(20px, 4vw, 30px);
            height: clamp(20px, 4vw, 30px);
            border: 2px solid #d4a574;
        }

        .menu-content::before {
            top: 15px;
            left: 15px;
            border-right: none;
            border-bottom: none;
        }

        .menu-content::after {
            top: 15px;
            right: 15px;
            border-left: none;
            border-bottom: none;
        }

        .menu-ornament-bottom {
            position: absolute;
            bottom: 15px;
            width: clamp(20px, 4vw, 30px);
            height: clamp(20px, 4vw, 30px);
            border: 2px solid #d4a574;
        }

        .menu-ornament-bottom-left {
            left: 15px;
            border-right: none;
            border-top: none;
        }

        .menu-ornament-bottom-right {
            right: 15px;
            border-left: none;
            border-top: none;
        }

        .game-title {
            font-size: clamp(1.8em, 5vw, 2.5em);
            margin-bottom: 10px;
            color: #d4a574;
            text-shadow: 0 0 20px rgba(212,165,116,0.5);
            font-weight: bold;
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: clamp(1em, 2.5vw, 1.2em);
            margin-bottom: 35px;
            color: #b8935f;
            font-style: italic;
        }

        #playerName {
            padding: 15px 20px;
            border-radius: 6px;
            border: 2px solid #d4a574;
            width: min(350px, 85%);
            margin-bottom: 25px;
            background: rgba(0,0,0,0.6);
            color: #d4a574;
            text-align: center;
            font-size: clamp(0.95em, 2.5vw, 1.05em);
            font-family: 'Georgia', serif;
        }

        #playerName:focus {
            outline: none;
            border-color: #f5d899;
            background: rgba(0,0,0,0.8);
            box-shadow: 0 0 20px rgba(212,165,116,0.3);
        }

        #playerName::placeholder {
            color: rgba(212,165,116,0.5);
            font-style: italic;
        }

        #startBtn {
            padding: 15px 60px;
            background: linear-gradient(135deg, #8b6914, #d4a574, #8b6914);
            border: 2px solid #d4a574;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            font-size: clamp(1em, 2.8vw, 1.15em);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-family: 'Georgia', serif;
            box-shadow: 0 4px 15px rgba(212,165,116,0.4);
            transition: all 0.3s;
        }

        #startBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(212,165,116,0.6);
            background: linear-gradient(135deg, #a07825, #f5d899, #a07825);
        }

        .menu-footer {
            margin-top: 35px;
            font-size: clamp(0.7em, 1.8vw, 0.85em);
            color: rgba(212,165,116,0.5);
            font-style: italic;
        }

        /* TEXTBOX */
        #textbox {
            width: min(92%, 900px);
            margin: 0 auto 15px auto;
            background: rgba(0,0,0,0.85);
            border: 2px solid #d4a574;
            border-radius: 8px;
            padding: clamp(15px, 3vw, 20px) clamp(20px, 4vw, 35px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.6), 0 0 20px rgba(212,165,116,0.2);
            min-height: clamp(90px, 12vh, 120px);
            max-height: 25vh;
            position: relative;
            overflow-y: auto;
        }

        #textbox.hidden { display: none; }

        .speaker-container {
            position: absolute;
            top: -12px;
            left: 25px;
        }

        #speaker {
            background: linear-gradient(135deg, #8b6914, #d4a574);
            padding: 4px 22px;
            border-radius: 4px;
            border: 2px solid #d4a574;
            font-weight: bold;
            font-size: clamp(0.85em, 2.2vw, 1em);
            color: #000;
            box-shadow: 0 2px 8px rgba(212,165,116,0.3);
        }

        #text {
            line-height: 1.7;
            font-size: clamp(0.9em, 2.3vw, 1.1em);
            margin-top: 8px;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .text-container {
            padding-right: 10px;
        }

        .next-indicator {
            position: absolute;
            bottom: 8px;
            right: 15px;
            animation: bounce 1s infinite;
            color: #d4a574;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        /* CHOICES */
        .choice-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            padding: 0 10px;
            max-height: 30vh;
            overflow-y: auto;
        }

        .choice {
            width: min(92%, 600px);
            background: rgba(0,0,0,0.75);
            color: #d4a574;
            padding: 13px 22px;
            border: 2px solid #8b6914;
            border-radius: 6px;
            cursor: pointer;
            font-size: clamp(0.85em, 2.2vw, 0.95em);
            transition: all 0.2s;
            text-align: left;
            line-height: 1.4;
            white-space: normal;
            word-wrap: break-word;
        }

        .choice:hover {
            background: linear-gradient(135deg, rgba(139,105,20,0.3), rgba(212,165,116,0.2));
            border-color: #d4a574;
            transform: translateY(-2px);
            box-shadow: 0 5px 18px rgba(212,165,116,0.3);
            color: #f5d899;
        }

        /* CONTROLS */
        .game-controls {
            position: fixed;
            bottom: 8px;
            right: 8px;
            display: flex;
            gap: 6px;
            z-index: 100;
        }

        .game-controls.hidden {
            display: none;
        }

        .control-btn {
            background: rgba(0,0,0,0.85);
            border: 1.5px solid #8b6914;
            color: #d4a574;
            padding: 7px 13px;
            border-radius: 4px;
            cursor: pointer;
            font-size: clamp(0.7em, 1.8vw, 0.85em);
            transition: all 0.2s;
        }

        .control-btn:hover {
            background: rgba(139,105,20,0.4);
            border-color: #d4a574;
            transform: scale(1.05);
        }

        #route-indicator {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0,0,0,0.85);
            padding: 8px 18px;
            border-radius: 4px;
            border: 1.5px solid #8b6914;
            font-size: clamp(0.7em, 1.8vw, 0.85em);
            color: #d4a574;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 100;
        }

        #route-indicator.visible { opacity: 1; }

        #toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15,15,15,0.95);
            color: #d4a574;
            padding: 15px 30px;
            border-radius: 8px;
            border: 1px solid rgba(212,165,116,0.3);
            z-index: 1001;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        #toast.show { opacity: 1; }
    </style>
</head>
<body>
    <audio id="bgm" loop></audio>
    <audio id="sfx"></audio>
    <div id="toast"></div>

    <div id="game-container">
        <div id="bg-layer">
            <img id="bg" alt="Cenário">
        </div>
        <div id="sprite-layer">
            <img id="charImg" alt="Personagem">
        </div>
        <div id="overlay"></div>

        <div id="ui-layer">
            <div id="route-indicator">
                <span id="route"></span>
            </div>

            <div id="main-menu">
                <div class="menu-content">
                    <h1 class="game-title">Second Chance</h1>
                    <p class="subtitle">Ruins of Destiny</p>
                    <input id="playerName" type="text" placeholder="Digite seu nome..." maxlength="20">
                    <br>
                    <button id="startBtn">Começar Aventura</button>
                    <div class="menu-footer">Manu&Sam Studios</div>
                    <span class="menu-ornament-bottom menu-ornament-bottom-left"></span>
                    <span class="menu-ornament-bottom menu-ornament-bottom-right"></span>
                </div>
            </div>

            <div id="textbox" class="hidden">
                <div class="speaker-container">
                    <span id="speaker"></span>
                </div>
                <div class="text-container">
                    <p id="text"></p>
                </div>
                <div class="next-indicator">▼</div>
            </div>

            <div id="choices" class="choice-container"></div>

            <div class="game-controls hidden">
                <button class="control-btn" onclick="saveGame()">💾 Salvar</button>
                <button class="control-btn" onclick="loadGame()">📂 Carregar</button>
            </div>
        </div>
    </div>

    <script>
        let playerName = "";
        let state = "menu";
        let isTyping = false;
        let currentRoute = "";
        let affection = { lucien: 0, eryon: 0, kaiden: 0, aelion: 0 };

        const bgm = document.getElementById("bgm");
        const sfx = document.getElementById("sfx");
        const bgImg = document.getElementById("bg");
        const charImg = document.getElementById("charImg");
        const speakerBox = document.getElementById("speaker");
        const textBox = document.getElementById("text");
        const textbox = document.getElementById("textbox");
        const choicesBox = document.getElementById("choices");
        const mainMenu = document.getElementById("main-menu");
        const routeIndicator = document.getElementById("route-indicator");
        const routeDisplay = document.getElementById("route");

        function typeText(element, text) {
            element.innerText = "";
            isTyping = true;
            let i = 0;
            function type() {
                if (i < text.length) {
                    element.innerText += text.charAt(i);
                    i++;
                    setTimeout(type, 30);
                } else {
                    isTyping = false;
                }
            }
            type();
        }

        function playMusic(filename) {
            if (!filename) return;
            const newSrc = "assets/audio/" + filename + ".mp3";
            if (bgm.getAttribute("src") === newSrc) return;
            bgm.src = newSrc;
            bgm.play().catch(() => {});
        }

        function setBackground(filename) {
            if (filename) {
                bgImg.style.opacity = "0";
                setTimeout(() => {
                    bgImg.src = encodeURI("assets/chars/" + filename + ".png");
                    bgImg.style.opacity = "1";
                }, 300);
            }
        }

        function setCharacter(filename) {
            if (!filename) {
                charImg.style.opacity = "0";
                return;
            }
            charImg.style.opacity = "0";
            setTimeout(() => {
                charImg.src = encodeURI("assets/chars/" + filename + ".png");
                charImg.style.opacity = "1";
            }, 250);
        }

        function showText(speaker, dialogue) {
            speakerBox.innerText = speaker || "";
            speakerBox.style.display = speaker ? "block" : "none";
            typeText(textBox, dialogue.replace(/\[Eu\]/g, playerName));
            textbox.classList.remove("hidden");
        }

        function updateRoute(routeName) {
            if (routeName) {
                currentRoute = routeName;
                routeDisplay.innerText = "Rota: " + routeName;
                routeIndicator.classList.add("visible");
            }
        }

        function showChoices(choices) {
            choicesBox.innerHTML = "";
            choices.forEach(choice => {
                const btn = document.createElement("button");
                btn.className = "choice";
                btn.innerText = choice.text;
                btn.onclick = (e) => {
                    e.stopPropagation();
                    if (choice.affect) affection[choice.affect] += (choice.value || 0);
                    choicesBox.innerHTML = "";
                    loadScene(choice.next);
                };
                choicesBox.appendChild(btn);
            });
        }

        function showToast(message) {
            const toast = document.getElementById("toast");
            toast.textContent = message;
            toast.classList.add("show");
            setTimeout(() => toast.classList.remove("show"), 3000);
        }

        const routes = {
            cena1_1: { speaker: "Eu", text: "Hoje foi uma sexta-feira complicada.", char: "escritório1", music: "escritório", next: "cena1_2" },
            cena1_2: { speaker: "Eu", text: "Já são 18h00. Hora de voltar para casa.", char: "escritório2", next: "cena2_1" },
            cena2_1: { speaker: "Eu", text: "Que frio... vou passar na farmácia.", char: "rua1", music: "chuva", next: "cena2_2" },
            cena2_2: { speaker: "", text: "Começou a chover.", char: "rua2", next: "cena3_1" },
            cena3_1: { speaker: "", text: "BAAAANG.", char: "acidente2", music: "o acidente", next: "cena3_2" },
            cena3_2: { speaker: "", text: "Tudo fica escuro.", char: "acidente4", next: "cena4_1" },
            cena4_1: { speaker: "Eu", text: "O que está acontecendo?", char: "vazio1", music: "menu", next: "cena4_2" },
            cena4_2: { speaker: "Aleia", text: "Eu sou Aleia. Você morreu.", char: "vazio3", next: "cena4_3" },
            cena4_3: { speaker: "Aleia", text: "Sua próxima reencarnação está à frente.", next: "cena5_1" },
            cena5_1: { speaker: "", text: "Acordo em ruínas antigas.", char: "ruinas1", music: "passos na floresta", next: "cena6_1" },
            cena6_1: { speaker: "Eu", text: "Qual caminho seguir?", char: "caminho2", choices: [
                { text: "Seguir o rio (Lucien)", next: "lucien_1", affect: "lucien", value: 1 },
                { text: "Descansar (Eryon)", next: "eryon_1", affect: "eryon", value: 1 },
                { text: "Floresta (Kaiden)", next: "kaiden_1", affect: "kaiden", value: 1 },
                { text: "Ruínas (Aelion)", next: "aelion_1", affect: "aelion", value: 1 }
            ]},
            lucien_1: { route: "Lucien", speaker: "", text: "Caminho pela margem do rio...", char: "lucien1", music: "gótica do lucien", next: "lucien_2" },
            lucien_2: { speaker: "", text: "Um castelo surge diante de mim.", char: "lucien3", next: "lucien_final" },
            lucien_final: { speaker: "Lucien", text: "Fim da rota de Lucien!", char: "lucien11", end: true, endText: "🩸 Obrigado por jogar!" },
            eryon_1: { route: "Eryon", speaker: "", text: "Descanso sob uma árvore...", char: "eryon1", music: "trilha do aelion", next: "eryon_final" },
            eryon_final: { speaker: "Eryon", text: "Fim da rota de Eryon!", char: "eryon10", end: true, endText: "☀️ Obrigado por jogar!" },
            kaiden_1: { route: "Kaiden", speaker: "", text: "Entro mais fundo na floresta...", char: "kaiden1", music: "mystical japanese", next: "kaiden_final" },
            kaiden_final: { speaker: "Kaiden", text: "Fim da rota de Kaiden!", char: "kaiden20", end: true, endText: "🦊 Obrigado por jogar!" },
            aelion_1: { route: "Aelion", speaker: "", text: "Volto às ruínas...", char: "aelion1", music: "trilha do aelion", next: "aelion_final" },
            aelion_final: { speaker: "Aelion", text: "Fim da rota de Aelion!", char: "aelion8", end: true, endText: "🌿 Obrigado por jogar!" }
        };

        function loadScene(sceneId) {
            const scene = routes[sceneId];
            if (!scene) return;
            state = sceneId;
            if (scene.route) updateRoute(scene.route);
            if (scene.char !== undefined) setCharacter(scene.char);
            if (scene.music) playMusic(scene.music);
            if (scene.text) showText(scene.speaker, scene.text);
            choicesBox.innerHTML = "";
            if (scene.choices) {
                showChoices(scene.choices);
                document.onclick = null;
            } else if (scene.next) {
                document.onclick = () => {
                    if (isTyping) return;
                    document.onclick = null;
                    loadScene(scene.next);
                };
            } else if (scene.end) {
                setTimeout(() => { alert(scene.endText); location.reload(); }, 2000);
            }
        }

        function saveGame() {
            localStorage.setItem("RUINS_SAVE", JSON.stringify({ scene: state, affection, route: currentRoute, playerName, date: new Date().toLocaleString() }));
            showToast("Jogo salvo!");
        }

        function loadGame() {
            const data = localStorage.getItem("RUINS_SAVE");
            if (!data) return showToast("Nenhum save encontrado.");
            const save = JSON.parse(data);
            affection = save.affection;
            currentRoute = save.route;
            playerName = save.playerName;
            state = save.scene;
            if (currentRoute) updateRoute(currentRoute);
            mainMenu.classList.add("hidden");
            document.querySelector(".game-controls").classList.remove("hidden");
            loadScene(save.scene);
            showToast("Jogo carregado!");
        }

        document.getElementById("startBtn").onclick = () => {
            playerName = document.getElementById("playerName").value.trim() || "Viajante";
            mainMenu.classList.add("hidden");
            document.querySelector(".game-controls").classList.remove("hidden");
            loadScene("cena1_1");
        };

        document.addEventListener("click", (e) => {
            if (e.target.closest(".choice") || e.target.closest(".control-btn") || e.target.id === "startBtn") return;
            const scene = routes[state];
            if (scene && scene.next && !isTyping && choicesBox.children.length === 0) loadScene(scene.next);
        });

        console.log("Second Chance - Ruins of Destiny");
        console.log("Manu&Sam Studios © 2026");
    </script>
</body>
</html>
